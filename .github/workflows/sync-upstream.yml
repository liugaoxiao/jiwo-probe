name: Sync upstream

on:
  schedule:
    # Daily at 03:23 UTC (11:23 Asia/Shanghai).
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'liugaoxiao/jiwo-probe'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream updates
        env:
          UPSTREAM_REPOSITORY: chnnic/jiwo-probe
          UPSTREAM_BRANCH: main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "Already up to date."
            exit 0
          fi

          if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            # These files contain fork-specific automation and Cloudflare bindings.
            for file in .github/workflows/sync-upstream.yml wrangler.jsonc; do
              if git ls-files -u -- "$file" | grep -q .; then
                git checkout --ours -- "$file"
                git add "$file"
              fi
            done

            remaining="$(git diff --name-only --diff-filter=U)"
            if [ -n "$remaining" ]; then
              echo "Unresolved upstream conflicts:"
              echo "$remaining"
              exit 1
            fi

            git commit --no-edit
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate synchronized code
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Push validated updates
        run: git push origin HEAD:main
